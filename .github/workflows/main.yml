name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL (if want to use SSH keys, use git@github.com:XXXXX)'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-14.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/yztyq/device_lenovo_tb375fc_twrp'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/lenovo/tb375fc'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'tb375fc'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_tb375fc'
      TARGET_RELEASE:
        description: 'TARGET_RELEASE (Android 14 必填，如 ap2a / trunk_staging)'
        required: false
        default: 'ap2a'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'vendorboot'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      # 任何需要输入账号/密码的 git 操作直接失败，绝不在 CI 里静默等待
      GIT_TERMINAL_PROMPT: 0
      GIT_ASKPASS: /bin/true
      DEBIAN_FRONTEND: noninteractive
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "Target Release: ${{ github.event.inputs.TARGET_RELEASE }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
        echo "::endgroup::"
        df -h
        free -h

    # You might want to Checkout your repo first, but not mandatory
    - name: Check Out
      uses: actions/checkout@v4

    # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
      timeout-minutes: 10
      # That's it! Now use your normal steps

    - name: Prepare the environment
      timeout-minutes: 30
      run: |
        set -e
        export DEBIAN_FRONTEND=noninteractive
        export TZ=Asia/Shanghai
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git gnupg gperf imagemagick lib32z1-dev libelf-dev liblz4-tool \
          libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
          pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
          unzip python3 python-is-python3 libbz2-dev lzma tree
        # 可选包装一个装一个，装不上就跳过，绝不因一个缺包把整条流水线卡死
        for p in gcc-10-multilib g++-10-multilib lib32ncurses-dev lib32readline-dev \
                   libwxgtk3.0-gtk3-dev libncurses5 libgl1-mesa-dev x11proto-core-dev \
                   libx11-dev ncftp qemu-user-static libstdc++-10-dev; do
          sudo apt-get install -y --no-install-recommends "$p" \
            || echo "::warning::optional package not installed: $p"
        done
        echo "=== toolchain ==="
        gcc --version | head -1
        g++ --version | head -1
        make --version | head -1

    - name: Install OpenJDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: |
              ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Install repo
      run: |
        mkdir -p "$HOME/bin"
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
        chmod a+x "$HOME/bin/repo"
        echo "$HOME/bin" >> "$GITHUB_PATH"
        "$HOME/bin/repo" --version

    - name: Initialize repo
      timeout-minutes: 30
      run: |
        set -e
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> "$GITHUB_OUTPUT"
        git config --global user.name "Nico170420"
        git config --global user.email "b170420nc@gmail.com"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
      id: pwd

    - name: Repo Sync
      timeout-minutes: 150
      working-directory: workspace
      run: |
        set -e
        mkdir -p "$GITHUB_WORKSPACE/artifacts"
        LOG="$GITHUB_WORKSPACE/artifacts/repo-sync.log"
        : > "$LOG"
        ( set -o pipefail; repo sync -j4 --force-sync --no-clone-bundle --no-tags 2>&1 | tee "$LOG" ) &
        sync_pid=$!
        (
          while kill -0 "$sync_pid" 2>/dev/null; do
            echo "Sync heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ) | .repo=$(du -sh .repo 2>/dev/null | cut -f1) | disk=$(df -h / | awk 'NR==2{print $4}') | last: $(tail -n 1 "$LOG" | cut -c1-140)"
            sleep 60
          done
        ) &
        hb_pid=$!
        set +e
        wait "$sync_pid"
        sync_status=$?
        kill "$hb_pid" 2>/dev/null || true
        wait "$hb_pid" 2>/dev/null || true
        set -e
        echo "repo sync exit=$sync_status"
        test "$sync_status" -eq 0

    - name: Clone device tree
      timeout-minutes: 15
      run: |
        set -e
        rm -rf "./${{ github.event.inputs.DEVICE_PATH }}"
        git clone --depth=1 ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      timeout-minutes: 15
      if: |
        github.event.inputs.COMMON_TREE_URL != null
        && github.event.inputs.COMMON_PATH != null
      run: |
        set -e
        git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check Build Tree
      uses: haya14busa/action-cond@v1
      id: buildtree
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' || github.event.inputs.MANIFEST_BRANCH == 'twrp-14.1' }}
        if_true: twrp
        if_false: omni

    - name: Sync Device Dependencies
      timeout-minutes: 60
      run: |
        set -u
        DEPS="${{ github.event.inputs.DEVICE_PATH }}/${{ steps.buildtree.outputs.value }}.dependencies"
        echo "=== dependencies file: $DEPS ==="
        if [ -f "$DEPS" ]; then
          cat "$DEPS"
        else
          echo "::warning::$DEPS 不存在，无依赖需要同步"
        fi
        CONV=""
        for c in "$GITHUB_WORKSPACE/scripts/convert.sh" "scripts/convert.sh" \
                 "vendor/twrp/scripts/convert.sh" "bootable/recovery/scripts/convert.sh"; do
          if [ -f "$c" ]; then CONV="$c"; break; fi
        done
        if [ -n "$CONV" ] && [ -f "$DEPS" ]; then
          echo "=== using $CONV ==="
          bash "$CONV" "$DEPS"
        else
          echo "::notice::convert.sh 未命中（已查 GITHUB_WORKSPACE/scripts、scripts、vendor/twrp/scripts、bootable/recovery/scripts），跳过依赖转换"
        fi
        echo "=== final repo sync ==="
        repo sync -j4 --no-clone-bundle --no-tags
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Patch TWRP sources (Android 14)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        set -e
        for F in bootable/recovery/Android.mk bootable/recovery/libtar/Android.mk; do
          if [ ! -f "$F" ]; then
            echo "::warning::$F 不存在，跳过"
            continue
          fi
          echo "--- $F : 修补前的 -ndk_platform 引用 ---"
          grep -n 'ndk_platform' "$F" || true
          if grep -q 'ndk_platform' "$F"; then
            sed -i 's/-ndk_platform/-ndk/g' "$F"
            echo "=== $F : -ndk_platform -> -ndk ==="
          else
            echo "=== $F 无需修补 ==="
          fi
          echo "--- $F : 修补后的 android.security.* 依赖 ---"
          grep -n 'android\.security\.\|android\.system\.keystore2' "$F" || true
        done
        echo "--- 全树其他 -ndk_platform 引用（仅报告，不修改）---"
        timeout 120 grep -rln --include='*.mk' --include='*.bp' 'ndk_platform' \
          bootable system device vendor hardware external 2>/dev/null | head -20 || true
        echo "--- 扫描结束 ---"

    - name: Patch libtar fscrypt API (vold 14)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        set -e
        LT=bootable/recovery/libtar
        if [ ! -d "$LT" ]; then
          echo "::error::找不到 $LT"
          exit 1
        fi

        echo "=== 1. 写入 fscrypt 兼容头 ==="
        cat > "$LT/fscrypt_compat.h" <<'CEOF'
        #ifndef TWRP_FSCRYPT_COMPAT_H
        #define TWRP_FSCRYPT_COMPAT_H

        /* Android 12.1 时代的 vold fscrypt C API 兼容层。
         * 背景：TWRP 14.1 的 bootable/recovery/libtar 仍按 vold android-12.1 的接口编写
         *       （union 型 fscrypt_policy、get_policy_size、get_policy_descriptor、
         *        lookup_ref_tar(fep, policy)），而 vold android-14.1 已删除这些，
         *        只保留 v1/v2 重载。此文件把它们按老语义补回来。
         */

        #include <stdbool.h>
        #include <stddef.h>
        #include <stdint.h>
        #include <stdio.h>
        #include <linux/fs.h>

        #include "fscrypt_policy.h"

        #ifndef FSCRYPT_POLICY_V1
        #define FSCRYPT_POLICY_V1 0
        #endif
        #ifndef FSCRYPT_POLICY_V2
        #define FSCRYPT_POLICY_V2 2
        #endif
        #ifndef FS_KEY_DESCRIPTOR_SIZE
        #define FS_KEY_DESCRIPTOR_SIZE 8
        #endif
        #ifndef FS_KEY_DESCRIPTOR_SIZE_HEX
        #define FS_KEY_DESCRIPTOR_SIZE_HEX (2 * FS_KEY_DESCRIPTOR_SIZE + 1)
        #endif
        #ifndef FSCRYPT_KEY_IDENTIFIER_SIZE
        #define FSCRYPT_KEY_IDENTIFIER_SIZE 16
        #endif
        #ifndef FSCRYPT_KEY_IDENTIFIER_SIZE_HEX
        #define FSCRYPT_KEY_IDENTIFIER_SIZE_HEX ((2 * FSCRYPT_KEY_IDENTIFIER_SIZE) + 1)
        #endif

        #undef fscrypt_policy
        typedef union fscrypt_policy {
        	uint8_t version;
        	struct fscrypt_policy_v1 v1;
        	struct fscrypt_policy_v2 v2;
        } fscrypt_policy;

        /* Android 14.1 的 vold 头里宏已自带 "2" 前缀，这里还原成 12.1 的写法，
           以免 libtar 拼出 "22CE" 这类对不上的字符串。 */
        #undef USER_CE_FSCRYPT_POLICY
        #undef USER_DE_FSCRYPT_POLICY
        #undef SYSTEM_DE_FSCRYPT_POLICY
        #define USER_CE_FSCRYPT_POLICY "CE"
        #define USER_DE_FSCRYPT_POLICY "DE"
        #define SYSTEM_DE_FSCRYPT_POLICY "DK"

        static inline uint8_t* get_policy_descriptor(fscrypt_policy* fep)
        {
        	if (!fep) return NULL;
        	if (fep->version == FSCRYPT_POLICY_V1) return fep->v1.master_key_descriptor;
        	if (fep->version == FSCRYPT_POLICY_V2) return fep->v2.master_key_identifier;
        	return NULL;
        }

        static inline uint8_t get_policy_size(fscrypt_policy* fep, bool hex)
        {
        	if (!fep) return 0;
        	if (fep->version == FSCRYPT_POLICY_V1)
        		return (uint8_t)(hex ? FS_KEY_DESCRIPTOR_SIZE_HEX : FS_KEY_DESCRIPTOR_SIZE);
        	if (fep->version == FSCRYPT_POLICY_V2)
        		return (uint8_t)(hex ? FSCRYPT_KEY_IDENTIFIER_SIZE_HEX : FSCRYPT_KEY_IDENTIFIER_SIZE);
        	return 0;
        }

        static inline void* get_policy(const fscrypt_policy* fep)
        {
        	if (!fep) return NULL;
        	if (fep->version == FSCRYPT_POLICY_V1) return (void*)&fep->v1;
        	if (fep->version == FSCRYPT_POLICY_V2) return (void*)&fep->v2;
        	return NULL;
        }

        static inline int fscrypt_policy_size(const fscrypt_policy* fep)
        {
        	if (!fep) return 0;
        	if (fep->version == FSCRYPT_POLICY_V1) return (int)sizeof(struct fscrypt_policy_v1);
        	if (fep->version == FSCRYPT_POLICY_V2) return (int)sizeof(struct fscrypt_policy_v2);
        	return 0;
        }

        static inline void get_policy_content(fscrypt_policy* fep, char* content)
        {
        	if (!fep || !content) return;
        	if (fep->version == FSCRYPT_POLICY_V1) {
        		snprintf(content, 50, "%i %i %i %i %s", (int)fep->v1.version,
        			(int)fep->v1.contents_encryption_mode,
        			(int)fep->v1.filenames_encryption_mode,
        			(int)fep->v1.flags, fep->v1.master_key_descriptor);
        	} else if (fep->version == FSCRYPT_POLICY_V2) {
        		snprintf(content, 50, "%i %i %i %i %s", (int)fep->v2.version,
        			(int)fep->v2.contents_encryption_mode,
        			(int)fep->v2.filenames_encryption_mode,
        			(int)fep->v2.flags, fep->v2.master_key_identifier);
        	}
        }

        #endif /* TWRP_FSCRYPT_COMPAT_H */

        CEOF
        echo "fscrypt_compat.h 已写入：$(wc -c < "$LT/fscrypt_compat.h") 字节"

        echo "=== 2. 把 include 换成兼容头 ==="
        for F in append.c block.c extract.c libtar.h output.c; do
          if [ -f "$LT/$F" ]; then
            sed -i 's|#include "fscrypt_policy.h"|#include "fscrypt_compat.h"|' "$LT/$F"
            echo "  $F -> $(grep -c 'fscrypt_compat.h' "$LT/$F") 处"
          fi
        done

        echo "=== 3. 把调用点改成 vold 14.1 的 v2 重载 ==="
        sed -i 's|fscrypt_policy_get_struct(realname, t->th_buf.fep)|fscrypt_policy_get_struct(realname, \&t->th_buf.fep->v2)|g' "$LT/append.c"
        sed -i 's|lookup_ref_key(t->th_buf.fep,|lookup_ref_key(\&t->th_buf.fep->v2,|g' "$LT/append.c"
        sed -i 's|lookup_ref_tar(t->th_buf.fep,|lookup_ref_tar((const uint8_t*)get_policy_descriptor(t->th_buf.fep),|g' "$LT/extract.c"
        sed -i 's|fscrypt_policy_set_struct(realname, t->th_buf.fep)|fscrypt_policy_set_struct(realname, \&t->th_buf.fep->v2)|g' "$LT/extract.c"

        echo "=== 4. 校验（任何一项没命中就立刻失败，别白跑 48 分钟）==="
        FUNCS=$(grep -c '^static inline' "$LT/fscrypt_compat.h" || true)
        if [ "$FUNCS" -lt 5 ]; then
          echo "::error::fscrypt_compat.h 只有 $FUNCS 个 helper，应为 5 个"
          exit 1
        fi
        echo "  兼容头 helper 数量: $FUNCS（get_policy_size / get_policy_descriptor / get_policy / fscrypt_policy_size / get_policy_content）"
        BAD=$(grep -rl '#include "fscrypt_policy.h"' "$LT" --include='*.c' --include='*.h' 2>/dev/null | grep -v 'fscrypt_compat.h' || true)
        if [ -n "$BAD" ]; then
          echo "::error::仍有文件 include 的是旧头: $BAD"
          exit 1
        fi
        echo "  include 已全部替换（兼容头自身保留对 fscrypt_policy.h 的引用）"
        grep -n 'fscrypt_policy_get_struct(realname, &t->th_buf.fep->v2)' "$LT/append.c" || { echo "::error::append.c get_struct 未替换"; exit 1; }
        grep -n 'lookup_ref_key(&t->th_buf.fep->v2' "$LT/append.c" || { echo "::error::append.c lookup_ref_key 未替换"; exit 1; }
        grep -n 'lookup_ref_tar((const uint8_t\*)get_policy_descriptor(t->th_buf.fep)' "$LT/extract.c" || { echo "::error::extract.c lookup_ref_tar 未替换"; exit 1; }
        grep -n 'fscrypt_policy_set_struct(realname, &t->th_buf.fep->v2)' "$LT/extract.c" || { echo "::error::extract.c set_struct 未替换"; exit 1; }
        echo "  全部替换生效"
        echo "=== libtar 补丁完成 ==="

    - name: Set Swap Space
      timeout-minutes: 15
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile || echo "::warning::swap 未启用，继续构建"
        free -h
        df -h

    - name: Building recovery
      timeout-minutes: 300
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        set -e
        mkdir -p "$GITHUB_WORKSPACE/artifacts"
        LOG="$GITHUB_WORKSPACE/artifacts/build.log"
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        RELEASE="${{ github.event.inputs.TARGET_RELEASE }}"
        [ -z "$RELEASE" ] && RELEASE=ap2a
        echo "=== lunch: ${{ github.event.inputs.MAKEFILE_NAME }}-${RELEASE}-eng ==="
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-${RELEASE}-eng
        echo "=== clean ==="
        make clean || true
        echo "=== build $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
        ( set -o pipefail; make ${{ github.event.inputs.BUILD_TARGET }}image -j"$(nproc --all)" 2>&1 | tee "$LOG" ) &
        build_pid=$!
        (
          while kill -0 "$build_pid" 2>/dev/null; do
            echo "Build heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ) | mem=$(free -m | awk '/Mem:/{print $7"MB"}') | disk=$(df -h / | awk 'NR==2{print $4}') | last: $(tail -n 1 "$LOG" | cut -c1-140)"
            sleep 120
          done
        ) &
        hb_pid=$!
        set +e
        wait "$build_pid"
        build_status=$?
        kill "$hb_pid" 2>/dev/null || true
        wait "$hb_pid" 2>/dev/null || true
        set -e
        echo "build exit=$build_status"
        echo "=== tail ==="
        tail -n 40 "$LOG" || true
        test "$build_status" -eq 0
        ls -l "out/target/product/${{ github.event.inputs.DEVICE_NAME }}/" || true

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.run_id }}
        path: |
          artifacts/repo-sync.log
          artifacts/build.log
        if-no-files-found: warn
        retention-days: 7

    - name: Collect artifacts
      run: |
        set -e
        OUT="workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        mkdir -p artifacts
        echo "=== $OUT ==="
        ls -l "$OUT" || true
        found=0
        for f in vendor_boot.img boot.img recovery.img; do
          if [ -f "$OUT/$f" ]; then
            cp "$OUT/$f" artifacts/
            echo "collected: $f"
            found=1
          fi
        done
        ls -l artifacts
        test "$found" -eq 1

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*.img
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: vendor_boot.img
          Version: Android14
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
